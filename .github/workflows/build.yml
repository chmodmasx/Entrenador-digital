name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: web/build.log
          if-no-files-found: ignore

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Build universal debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee android-build.log

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/android-build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Entrenador-digital-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
